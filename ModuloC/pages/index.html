<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - ShanYu</title>

  <!-- Importando os assets -->
  <link rel="stylesheet" href="assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
  <div class="container-fluid p-0 row row-cols-2" style="height: 100vh;">
    <div class="col-md-6 overflow-hidden h-100 rounded-5 rounded-start-0 rounded-start-0 shadow">
      <img src="./assets/img/banner_login.png" alt="Shangai city" class="h-100">
    </div>
    <div class="col-md-6 d-flex align-items-center justify-content-center position-relative">
      <!-- Imagem de fundo -->
      <img src="./assets/img/japones-logo.png" class="position-absolute top-0 h-100 z-0" style="opacity: 5%;">

      <!-- Formulario -->
      <div class="w-75 form-content d-flex flex-column align-items-center gap-3 z-0">
        <img src="./assets/img/brand.png" alt="">
        <h1 class="mb-4 fs-5 text-center">Ajudando a promover nossa cultura</h1>

        <form class="w-100 gap-3">
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email">
          </div>
          <div class="mb-3">
            <label for="senha" class="form-label">Senha</label>
            <input type="password" class="form-control" id="senha">
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-primary-theme">Entrar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="assets/js/bootstrap.min.js"></script>
</body>

</html>
